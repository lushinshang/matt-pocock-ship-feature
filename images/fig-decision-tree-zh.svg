<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>開新工作時選哪個做法的決策樹</title>
<desc>黑底決策樹，由上而下：新的 session 先問 diff 夠不夠小；是就一次做完（One Shot），否就用 /grill-with-docs；再問是否比你想的還大，是就改走 /wayfinder，否就繼續 grilling。依影片畫面翻譯重繪，原圖為英文。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2f2f2"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 L0 5" stroke="#8a8a8a" stroke-width="1.6"/></pattern></defs>
<rect width="960" height="830" fill="#fbfaf7"/>
<rect x="10" y="10" width="940" height="810" rx="18" fill="#111111" stroke="#111111" stroke-width="1"/>
<circle cx="70" cy="64" r="15" fill="url(#hatch)" stroke="#4aa3f0" stroke-width="3"/>
<text x="104" y="72" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start">一個新的 session</text>
<text x="104" y="102" font-size="14" fill="#b4b4b4" text-anchor="start">你想開始一件新工作，卻不知道該選哪個做法。</text>
<path d="M70 84 L70 147" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<polygon points="70,152 90,172 70,192 50,172" fill="url(#hatch)" stroke="#f08a3c" stroke-width="3" stroke-linejoin="round"/>
<text x="104" y="180" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start">diff 夠小嗎？</text>
<text x="104" y="210" font-size="14" fill="#b4b4b4" text-anchor="start">你能很快審完 agent 的 diff 嗎？重做一次幾乎不花時間嗎？</text>
<path d="M70 196 L70 268" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M70 268 L70 364" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<text x="86" y="326" font-size="20" fill="#f2f2f2" font-weight="bold" text-anchor="start">否</text>
<path d="M70 268 L418 268" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<text x="244" y="256" font-size="20" fill="#f2f2f2" font-weight="bold" text-anchor="middle">是</text>
<rect x="420.0" y="251.0" width="34" height="34" rx="8" fill="url(#hatch)" stroke="#f6c33b" stroke-width="3"/>
<text x="470" y="276" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start">一次做完（One Shot）</text>
<text x="470" y="306" font-size="13" fill="#b4b4b4" text-anchor="start">動手前不必先對齊，看到 diff 之後再對齊。</text>
<rect x="53.0" y="371.0" width="34" height="34" rx="8" fill="url(#hatch)" stroke="#f6c33b" stroke-width="3"/>
<text x="104" y="396" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start" font-family="Menlo, Consolas, monospace">/grill-with-docs</text>
<text x="104" y="426" font-size="14" fill="#b4b4b4" text-anchor="start">先對齊再動手，並把領域語言定下來。</text>
<path d="M70 410 L70 475" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<polygon points="70,480 90,500 70,520 50,500" fill="url(#hatch)" stroke="#f08a3c" stroke-width="3" stroke-linejoin="round"/>
<text x="104" y="508" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start">比你想的還大嗎？</text>
<text x="104" y="538" font-size="14" fill="#b4b4b4" text-anchor="start">grilling 是不是正在進入 dumb zone？迷霧比預期的多嗎？</text>
<path d="M70 524 L70 596" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M70 596 L70 692" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<text x="86" y="654" font-size="20" fill="#f2f2f2" font-weight="bold" text-anchor="start">否</text>
<path d="M70 596 L418 596" stroke="#f2f2f2" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ahw)"/>
<text x="244" y="584" font-size="20" fill="#f2f2f2" font-weight="bold" text-anchor="middle">是</text>
<rect x="420.0" y="579.0" width="34" height="34" rx="8" fill="url(#hatch)" stroke="#f6c33b" stroke-width="3"/>
<text x="470" y="604" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start" font-family="Menlo, Consolas, monospace">/wayfinder</text>
<text x="470" y="634" font-size="13" fill="#b4b4b4" text-anchor="start">把最初的 grilling session 變成一張 Wayfinder 地圖，從那裡繼續。</text>
<rect x="53.0" y="699.0" width="34" height="34" rx="8" fill="url(#hatch)" stroke="#f6c33b" stroke-width="3"/>
<text x="104" y="724" font-size="24" fill="#f2f2f2" font-weight="bold" text-anchor="start">繼續</text>
<text x="104" y="754" font-size="14" fill="#b4b4b4" text-anchor="start">繼續 grilling、grilling、grilling！</text>
<text x="40" y="800" font-size="13" fill="#b4b4b4" text-anchor="start">依 Matt Pocock 影片畫面（03:09）翻譯重繪，原圖為英文</text>
</svg>
