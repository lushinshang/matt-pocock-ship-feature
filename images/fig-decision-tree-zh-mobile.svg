<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 694" width="480" height="694" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>開新工作時選 skill 的決策順序</title>
<desc>由上而下：先看這份 diff 是否很小；小就直接一次做完，不必 grilling；否則先用 grill-with-docs，做下去若比想像大很多，再改走 wayfinder，拉長到多個 session。先從 grill-with-docs 起手是講者的偏好。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="480" height="694" fill="#fbfaf7"/>
<rect x="100" y="20" width="280" height="46" rx="8" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="240" y="49" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">要做的東西：一份 diff</text>
<path d="M240 68 L240 92" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<polygon points="240,92.0 350.0,140 240,188.0 130.0,140" fill="#e8e8e4" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="240" y="145.25" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">diff 很小？</text>
<path d="M240 188 L240 222" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="250" y="208" font-size="15" fill="#222222" font-weight="bold" text-anchor="start">是</text>
<rect x="20" y="224" width="400" height="52" rx="10" fill="#f1f1ed" stroke="#9a9a92" stroke-width="1.5"/>
<text x="220" y="256" font-size="15" fill="#222222" text-anchor="middle">大概直接一次做完，不必 grilling</text>
<path d="M350 140 L452 140 L452 314 L240 314 L240 328" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="362" y="130" font-size="15" fill="#222222" font-weight="bold" text-anchor="start">否</text>
<rect x="110" y="330" width="260" height="52" rx="10" fill="#3d7049" stroke="#3d7049" stroke-width="1.5"/>
<text x="240" y="363" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">grill-with-docs</text>
<rect x="20" y="396" width="440" height="44" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="240" y="424" font-size="13" fill="#222222" text-anchor="middle">先從這裡起手：規模若比預期小，就省掉 wayfinder 的額外負擔</text>
<path d="M240 384 L240 394" stroke="#444" stroke-width="2" fill="none"/>
<path d="M240 442 L240 470" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<polygon points="240,472.0 360.0,520 240,568.0 120.0,520" fill="#e8e8e4" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="240" y="525.25" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">比想像大很多？</text>
<path d="M240 568 L240 600" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="250" y="588" font-size="15" fill="#222222" font-weight="bold" text-anchor="start">是</text>
<rect x="20" y="602" width="400" height="52" rx="10" fill="#f1f1ed" stroke="#9a9a92" stroke-width="1.5"/>
<text x="220" y="634" font-size="14" fill="#222222" text-anchor="middle">改走 wayfinder，拉長到多個 session</text>
<text x="240" y="682" font-size="13" fill="#555555" text-anchor="middle">依影片 3:08 到 4:10 的口述整理</text>
</svg>
