<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 622" width="480" height="622" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>一個大 PR 拆成 7 個依序合併的 PR</title>
<desc>左邊一個大 PR，右邊 7 個小 PR 堆疊：第一個含術語表詞條、diagram component、ADR-060，第二個抽出共用的 diagram 編輯器，中間幾個只標講者提到的內容，最後一個合併時打開 feature flag。圖例說明雙向門與單向門。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="480" height="622" fill="#fbfaf7"/>
<rect x="120" y="20" width="240" height="56" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="240" y="55" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">一個大 PR</text>
<path d="M240 78 L240 112" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="256" y="100" font-size="15" fill="#222222" font-weight="bold" text-anchor="start">拆成 7 個依序合併的 PR</text>
<rect x="20" y="118" width="440" height="46" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="240" y="147" font-size="14" fill="#222222" text-anchor="middle">術語表詞條、diagram component、ADR-060</text>
<rect x="20" y="172" width="440" height="46" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="240" y="201" font-size="14" fill="#222222" text-anchor="middle">抽出共用的 diagram 編輯器</text>
<rect x="20" y="226" width="440" height="206" rx="8" fill="#f6f6f2" stroke="#b5b4aa" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="60" y="234" width="360" height="30" rx="8" fill="#e8e8e4" stroke="#b5b4aa" stroke-width="1"/>
<rect x="60" y="270" width="360" height="30" rx="8" fill="#e8e8e4" stroke="#b5b4aa" stroke-width="1"/>
<rect x="60" y="306" width="360" height="30" rx="8" fill="#e8e8e4" stroke="#b5b4aa" stroke-width="1"/>
<rect x="60" y="342" width="360" height="30" rx="8" fill="#e8e8e4" stroke="#b5b4aa" stroke-width="1"/>
<text x="240" y="392" font-size="13" fill="#222222" text-anchor="middle">中間各 PR：講者念到約 500 行、約 2,500 行</text>
<text x="240" y="416" font-size="13" fill="#222222" text-anchor="middle">其中一個是只新增欄位的 migration，講者唯一認為必審</text>
<rect x="20" y="446" width="440" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="240" y="475" font-size="14" fill="#222222" text-anchor="middle">最後一個：合併時打開 feature flag</text>
<path d="M26 526 L74 526" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="90" y="531" font-size="14" fill="#222222" text-anchor="start">雙向門：合併後隨時可以 revert</text>
<path d="M26 560 L74 560" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="90" y="565" font-size="14" fill="#222222" text-anchor="start">單向門：合併後很難還原</text>
<text x="240" y="604" font-size="13" fill="#555555" text-anchor="middle">依影片 48:43 到 57:50 的口述整理</text>
</svg>
