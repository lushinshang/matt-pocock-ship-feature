<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>兩次 comment 稽核結果（單位不同，各自刻度）</title>
<desc>上格是第一次稽核，多以行計：約 2,000 行註解，其中約 940 行可刪、約 1,000 行說明程式碼看不出的理由，另有 7 個註解已過期；下格是追問後，字幕未說單位：22 個可直接刪、18 個變通寫法要改、3 個可寫成 ADR。兩格單位與範圍不一定相同，不可相互比較。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="960" height="560" fill="#fbfaf7"/>
<rect x="20" y="16" width="920" height="230" rx="8" fill="#ffffff" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" fill="#222222" font-weight="bold" text-anchor="start">第一次稽核（多以行計）</text>
<rect x="40" y="64" width="700" height="32" rx="4" fill="#5c6b7a" stroke="#5c6b7a" stroke-width="1"/>
<text x="52" y="86" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">約 2,000 行註解</text>
<text x="40" y="124" font-size="14" fill="#222222" text-anchor="start">約 940 行可刪</text>
<rect x="40" y="132" width="329.0" height="26" rx="4" fill="#d9822b" stroke="#d9822b" stroke-width="1"/>
<text x="40" y="184" font-size="14" fill="#222222" text-anchor="start">約 1,000 行說明程式碼看不出的理由</text>
<rect x="40" y="192" width="350.0" height="26" rx="4" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1"/>
<circle cx="780" cy="205" r="6" fill="#b3392f"/>
<text x="794" y="210" font-size="14" fill="#222222" text-anchor="start">7 個註解已過期</text>
<path d="M20 276 L940 276" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<text x="480" y="306" font-size="16" fill="#222222" font-weight="bold" text-anchor="middle">單位與範圍不一定相同，不可相互比較</text>
<rect x="20" y="326" width="920" height="190" rx="8" fill="#ffffff" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="40" y="356" font-size="18" fill="#222222" font-weight="bold" text-anchor="start">追問後（字幕未說單位）</text>
<rect x="40" y="376" width="400.00000000000006" height="26" rx="4" fill="#d9822b" stroke="#d9822b" stroke-width="1"/>
<text x="454.00000000000006" y="395" font-size="14" fill="#222222" text-anchor="start">22 個可直接刪</text>
<rect x="40" y="416" width="327.2727272727273" height="26" rx="4" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1"/>
<text x="381.2727272727273" y="435" font-size="14" fill="#222222" text-anchor="start">18 個變通寫法要改</text>
<rect x="40" y="456" width="54.54545454545455" height="26" rx="4" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="108.54545454545455" y="475" font-size="14" fill="#222222" text-anchor="start">3 個可寫成 ADR</text>
<text x="480" y="542" font-size="13" fill="#555555" text-anchor="middle">Claude 稽核結果，由講者念出</text>
