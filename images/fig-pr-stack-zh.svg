<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 604" width="984" height="604" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>一個大 PR 拆成 9 個小 PR，每個標示門類型</title>
<desc>左邊是一個大 PR（草稿 #2734，+21,349 −371，37 個 commit、71 個檔案），箭頭指向右邊由上往下排列的 9 個小 PR；9 列都標有 Claude 判斷的門類型：8 列雙向門（綠，其中第 9 列為依說明推定）、1 列單向門（橘，只含 migration 與 schema）。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="984" height="604" fill="#fbfaf7"/>
<rect x="24" y="228.0" width="240" height="150" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="144" y="291.0" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">一個大 PR（草稿 #2734）</text>
<text x="144" y="319.0" font-size="13" fill="#ffffff" text-anchor="middle"><tspan x="144" y="319.0">+21,349 −371，37 個 commit、</tspan><tspan x="144" y="338.0">71 個檔案</tspan></text>
<path d="M266 303.0 L288 303.0" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M292 87.0 L292 519.0" stroke="#666" stroke-width="2" fill="none"/>
<path d="M292 87.0 L309 87.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="64.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="92.0" font-size="15" fill="#222222" text-anchor="start">術語表詞條、diagram component 與 ADR 0060（只有文件）</text>
<rect x="884.66" y="75.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="91.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 141.0 L309 141.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="118.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="146.0" font-size="15" fill="#222222" text-anchor="start">抽出共用的 diagram 編輯器</text>
<rect x="884.66" y="129.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="145.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 195.0 L309 195.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="172.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="200.0" font-size="15" fill="#222222" text-anchor="start">「Go to」開啟 DiagramSnapshot 時不還原</text>
<rect x="884.66" y="183.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="199.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 249.0 L309 249.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="226.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="254.0" font-size="15" fill="#222222" text-anchor="start">在指令面板加入「Insert diagram」</text>
<rect x="884.66" y="237.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="253.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 303.0 L309 303.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="280.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="308.0" font-size="15" fill="#222222" text-anchor="start">縮圖編輯器的零件（不需要 schema 的程式碼）</text>
<rect x="884.66" y="291.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="307.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 357.0 L309 357.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="334.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="330" y="362.0" font-size="15" fill="#222222" text-anchor="start">只含 migration 與 schema：只新增欄位，約 35 行（不含測試）</text>
<rect x="884.66" y="345.0" width="59.34" height="24" rx="12.0" fill="#d9822b" stroke="#d9822b" stroke-width="1"/>
<text x="914.3299999999999" y="361.55" font-size="13" fill="#222222" font-weight="bold" text-anchor="middle">單向門</text>
<path d="M292 411.0 L309 411.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="388.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="416.0" font-size="15" fill="#222222" text-anchor="start">持久化：儲存與複製、記錄來源、搜尋、封存、Draft 防護</text>
<rect x="884.66" y="399.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="415.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 465.0 L309 465.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="442.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="470.0" font-size="15" fill="#222222" text-anchor="start">縮圖頁面編輯器（feature flag 關閉）</text>
<rect x="884.66" y="453.0" width="59.34" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="914.3299999999999" y="469.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門</text>
<path d="M292 519.0 L309 519.0" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="312" y="496.0" width="648" height="46" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="330" y="524.0" font-size="15" fill="#222222" text-anchor="start">兩個編輯器都能搜尋（打開 feature flag）</text>
<rect x="829.54" y="507.0" width="114.46000000000001" height="24" rx="12.0" fill="#3d7049" stroke="#3d7049" stroke-width="1"/>
<text x="886.77" y="523.55" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">雙向門（推定）</text>
<text x="24" y="580" font-size="13" fill="#555555" text-anchor="start">依 Matt Pocock 影片畫面（49:55、51:15）翻譯重繪；Claude 的方案，講者選用 1–9；第 9 個的門類型被鏡頭擋住，依 Claude 的說明推定</text>
</svg>
