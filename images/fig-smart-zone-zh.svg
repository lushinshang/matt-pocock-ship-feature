<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>5 個方塊兩兩相連的關係弧線</title>
<desc>5 個方塊，相鄰兩兩有雙向箭頭，其餘配對以圓弧雙向箭頭相連，表示每個 token 都要和其餘所有 token 建立關係（講者的口頭解釋）。</desc>
