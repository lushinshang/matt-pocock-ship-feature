<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 644" width="480" height="644" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>retro：從輸入到四條去路（兩條來自同一個根本原因）</title>
<desc>左側兩個輸入（約 30 個 session 的紀錄、12 則 review comment）進入 retro，找出同一個根本原因，再分成四條去路：其中棘輪式 lint rule 提案與修正教錯的文件兩條來自同一個根本原因，替 skills 開 issue 與約 20 個 issue 交給 agent 兩條直接從 retro 分出；一條回饋線回到輸入端。</desc>
